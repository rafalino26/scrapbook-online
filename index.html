<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#571e2b"><title>Scrapbook</title><link rel="stylesheet" href="style.css"><script src="content.js" defer></script><script src="public/vendor/page-flip.browser.js" defer></script><script src="swipe.js" defer></script><script src="app.js" defer></script></head>
